name: Daily Jingcai Reports

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "生成指定日期（YYYY-MM-DD），留空则默认昨天"
        required: false
        type: string
      min_tag:
        description: "起始编号"
        required: false
        default: "1"
        type: string
      max_tag:
        description: "结束编号"
        required: false
        default: "25"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-jingcai-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      site_base: ${{ steps.base.outputs.site_base }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve base path
        id: base
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "site_base=" >> "$GITHUB_OUTPUT"
          else
            echo "site_base=/$REPO_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Build daily report JSON
        env:
          DQD_AUTHORIZATION: ${{ secrets.DQD_AUTHORIZATION }}
          DQD_COOKIE: ${{ secrets.DQD_COOKIE }}
        run: |
          if [[ -n "${{ inputs.date }}" ]]; then
            node scripts/build-daily-reports.mjs \
              --date "${{ inputs.date }}" \
              --min-tag "${{ inputs.min_tag || '1' }}" \
              --max-tag "${{ inputs.max_tag || '25' }}"
          else
            node scripts/build-daily-reports.mjs \
              --min-tag "${{ inputs.min_tag || '1' }}" \
              --max-tag "${{ inputs.max_tag || '25' }}"
          fi

      - name: Build site
        env:
          SITE_BASE_PATH: ${{ steps.base.outputs.site_base }}
        run: node scripts/build-site.mjs

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: refresh daily jingcai reports"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
